<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor wishlist</title>
  <style>
    :root {
      --green: #1f6b47;
      --green-dark: #164f35;
      --green-soft: #dcefe4;
      --ink: #18211d;
      --muted: #5b6862;
      --line: #dfe5e2;
      --bg: #f5f7f6;
      --card: #ffffff;
      --high-bg: #fbe0de; --high-fg: #a8231b;
      --med-bg: #fcecc8; --med-fg: #8a5a00;
      --low-bg: #dcefe4; --low-fg: #1f6b47;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .page { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }
    .hero { background: var(--green); color: #fff; margin: 0 -16px; padding: 28px 20px 26px; }
    .org { margin: 0 0 6px; font-size: 13px; letter-spacing: .02em; opacity: .85; display: flex; align-items: center; gap: 8px; }
    .org svg { flex: none; }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .lead { margin: 8px 0 0; font-size: 16px; opacity: .92; max-width: 34em; }
    .needs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }
    h2 { font-size: 18px; margin: 0; }
    .share { border: 1px solid var(--line); background: var(--card); color: var(--green); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
    .name { font-weight: 650; font-size: 17px; margin: 0; overflow-wrap: anywhere; }
    .needed { margin: 0; font-size: 15px; }
    .needed strong { font-size: 18px; }
    .updated { grid-column: 1 / -1; margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .pill { font-size: 13px; font-weight: 650; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .pill.High { background: var(--high-bg); color: var(--high-fg); }
    .pill.Medium { background: var(--med-bg); color: var(--med-fg); }
    .pill.Low { background: var(--low-bg); color: var(--low-fg); }
    .skeleton { height: 86px; border-radius: 14px; background: linear-gradient(90deg, #eceff0, #f6f7f7, #eceff0); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: 0 0; } }
    .note { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 18px 16px; color: var(--muted); margin: 0; }
    .howto { background: var(--green-soft); border-radius: 14px; padding: 18px 16px; margin-top: 24px; }
    .howto p { margin: 8px 0 0; }
    .howto dl { margin: 12px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
    .howto dt { font-weight: 650; }
    .howto dd { margin: 0; overflow-wrap: anywhere; }
    footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); display: flex; justify-content: center; }
    .cta button { width: 100%; max-width: 608px; min-height: 52px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: inherit; font-weight: 650; font-size: 17px; cursor: pointer; }
    .cta button:focus-visible, .share:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="org">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M20 3C9 3 4 9 4 15c0 2 .6 3.8 1.6 5.2l1.5-1.4C9 15 12 12 16 10c-3 2.6-5.6 5.6-7.4 9.4C9.7 20.5 11.2 21 13 21c6 0 8-7 7-18z"/></svg>
        <span id="org">Kechara Soup Kitchen</span>
      </p>
      <h1 id="title">Help fill our pantry</h1>
      <p id="message" class="lead">Your donations make a difference. These are the items we need most right now.</p>
    </header>

    <section aria-labelledby="needs-heading">
      <div class="needs-head">
        <h2 id="needs-heading">Most needed right now</h2>
        <button id="share" class="share" type="button" hidden>Share</button>
      </div>
      <ul id="list" class="list" aria-busy="true">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
    </section>

    <section id="howto" class="howto" aria-labelledby="howto-heading" hidden>
      <h2 id="howto-heading">How to donate</h2>
      <p id="howto-text"></p>
      <dl id="howto-details"></dl>
    </section>

    <footer id="footer">Needs change as stock comes in and goes out.</footer>
  </main>

  <div class="cta" id="cta" hidden><button type="button" id="cta-button">How to donate</button></div>

  <script>
    (function () {
      'use strict';
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var shareUrl = '';

      function $(id) { return document.getElementById(id); }

      function esc(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function fmtDay(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1] : '';
      }

      function render(data) {
        var list = $('list');
        list.setAttribute('aria-busy', 'false');
        data = data || {};
        var info = data.info || {};
        if (info.title) $('title').textContent = info.title;
        if (info.message) $('message').textContent = info.message;

        var items = data.items || [];
        if (!data.configured) {
          list.innerHTML = '<li class="note">The wishlist is being set up. Please check back soon.</li>';
        } else if (!items.length) {
          list.innerHTML = '<li class="note">Nothing urgent right now. Thank you for thinking of us!</li>';
        } else {
          list.innerHTML = items.map(function (it) {
            var pill = it.priority ? '<span class="pill ' + esc(it.priority) + '">' + esc(it.priority) + ' priority</span>' : '<span></span>';
            var updated = it.updated ? '<p class="updated">Updated ' + esc(fmtDay(it.updated)) + '</p>' : '';
            return '<li class="card"><p class="name">' + esc(it.name) + '</p>' + pill +
              '<p class="needed">Needed: <strong>' + esc(it.needed) + '</strong></p>' + updated + '</li>';
          }).join('');
        }

        var details = [['Address', info.address], ['Opening hours', info.hours], ['Contact', info.contact]]
          .filter(function (d) { return d[1]; });
        if (info.howTo || details.length) {
          $('howto-text').textContent = info.howTo || '';
          $('howto-details').innerHTML = details.map(function (d) { return '<dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd>'; }).join('');
          $('howto').hidden = false;
          $('cta').hidden = false;
        }

        shareUrl = info.link || '';
        if (shareUrl && (navigator.share || navigator.clipboard)) $('share').hidden = false;
      }

      function fail() {
        $('list').setAttribute('aria-busy', 'false');
        $('list').innerHTML = '<li class="note">The wishlist could not load. Please check your connection and refresh the page.</li>';
      }

      $('cta-button').addEventListener('click', function () {
        $('howto').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      $('share').addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({ title: document.title, text: $('title').textContent, url: shareUrl }).catch(function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl).then(function () { $('share').textContent = 'Link copied'; });
        }
      });

      google.script.run.withSuccessHandler(render).withFailureHandler(fail).getWishlist();
    })();
  </script>
</body>
</html>
