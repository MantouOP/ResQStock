<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Donor wishlist</title>
  <style>
    /* Cards follow the width of their list, including beside the donation panel.
       The page scrolls vertically; controls and names never need a wider screen. */
    :root {
      --green: #1f6b47;
      --green-dark: #164f35;
      --green-soft: #dcefe4;
      --ink: #18211d;
      --muted: #5b6862;
      --line: #dfe5e2;
      --bg: #f5f7f6;
      --card: #ffffff;
      --high-bg: #fbe0de; --high-fg: #a8231b;
      --med-bg: #fcecc8; --med-fg: #8a5a00;
      --low-bg: #dcefe4; --low-fg: #1f6b47;
      --page-max: 1280px;
      --gutter: 16px;
      --gutter-left: max(var(--gutter), env(safe-area-inset-left));
      --gutter-right: max(var(--gutter), env(safe-area-inset-right));
    }
    @media (min-width: 640px) { :root { --gutter: 28px; } }
    @media (min-width: 1000px) { :root { --gutter: 32px; } }

    * { box-sizing: border-box; }
    html { accent-color: var(--green); -webkit-tap-highlight-color: transparent; scroll-padding-block: 16px calc(104px + env(safe-area-inset-bottom)); }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; overflow-wrap: anywhere; }
    button { min-width: 0; max-width: 100%; }
    .layout > *, .card > * { min-width: 0; }
    ::selection { background: #bfe3cf; color: var(--ink); }
    [hidden] { display: none !important; }

    .hero { background: var(--green); color: #fff; padding: calc(28px + env(safe-area-inset-top)) 0 26px; }
    .hero-inner { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--gutter-right) 0 var(--gutter-left); }
    .org { margin: 0 0 8px; font-size: 14px; color: #d7eadf; display: flex; align-items: center; gap: 8px; }
    .org svg { flex: none; }
    h1 { margin: 0; font-size: clamp(28px, 4.4vw, 46px); line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
    .lead { margin: 10px 0 0; font-size: 16px; color: #e3f1e8; max-width: 38em; }

    .page { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--gutter-right) calc(104px + env(safe-area-inset-bottom)) var(--gutter-left); }
    .needs-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 24px 0 12px; }
    h2 { font-size: 18px; margin: 0; }
    .share { border: 1px solid var(--line); background: var(--card); color: var(--green); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 12px; }
    .card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-content: start; align-items: start; }
    .name { grid-column: 1 / -1; font-weight: 650; font-size: 17px; margin: 0; overflow-wrap: anywhere; }
    .needed { grid-column: 1; grid-row: 2; margin: 0; font-size: 15px; }
    .needed strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    .updated { grid-column: 1 / -1; margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .pill { grid-column: 2; grid-row: 2; justify-self: end; font-size: 13px; font-weight: 650; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .pill.High { background: var(--high-bg); color: var(--high-fg); }
    .pill.Medium { background: var(--med-bg); color: var(--med-fg); }
    .pill.Low { background: var(--low-bg); color: var(--low-fg); }
    .skeleton { height: 86px; border-radius: 14px; background: linear-gradient(90deg, #eceff0, #f6f7f7, #eceff0); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: 0 0; } }
    .note { grid-column: 1 / -1; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 18px 16px; color: var(--muted); margin: 0; }

    .howto { background: var(--green-soft); border-radius: 14px; padding: 18px 16px; margin-top: 24px; }
    .howto p { margin: 8px 0 0; }
    .howto dl { margin: 12px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .howto dt { font-weight: 650; }
    .howto dd { margin: 0; overflow-wrap: anywhere; }
    .howto dd + dt { margin-top: 8px; }
    footer { margin-top: 24px; font-size: 13px; color: var(--muted); }

    .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px var(--gutter-right) calc(12px + env(safe-area-inset-bottom)) var(--gutter-left); background: var(--bg); display: flex; justify-content: center; }
    .cta button { width: 100%; max-width: 608px; min-height: 52px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: inherit; font-weight: 650; font-size: 17px; cursor: pointer; }
    .cta button:focus-visible, .share:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

    @media (min-width: 640px) {
      .hero { padding-top: calc(40px + env(safe-area-inset-top)); padding-bottom: 36px; }
    }
    @media (min-width: 1000px) {
      .hero { padding-top: calc(56px + env(safe-area-inset-top)); padding-bottom: 48px; }
      .lead { font-size: 18px; }
      .page { padding-bottom: 64px; }
      .needs-head { margin-top: 32px; }
      .layout.has-howto { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 320px); gap: 32px; align-items: start; }
      .layout.has-howto .howto { position: sticky; top: 24px; margin-top: 32px; padding: 22px 20px; }
      .cta { display: none !important; }
      footer { margin-top: 32px; }
    }
    @media (max-height: 700px) {
      .layout.has-howto .howto { position: static; }
    }
    @media (max-height: 500px) and (max-width: 999px) {
      .cta { position: static; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .page { padding-bottom: 24px; }
    }
    @media (hover: hover) {
      .share:hover { border-color: var(--green); }
      .cta button:hover { background: var(--green-dark); }
    }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="org">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M20 3C9 3 4 9 4 15c0 2 .6 3.8 1.6 5.2l1.5-1.4C9 15 12 12 16 10c-3 2.6-5.6 5.6-7.4 9.4C9.7 20.5 11.2 21 13 21c6 0 8-7 7-18z"/></svg>
        <span id="org">Kechara Soup Kitchen</span>
      </p>
      <h1 id="title">Help fill our pantry</h1>
      <p id="message" class="lead">Your donations make a difference. These are the items we need most right now.</p>
    </div>
  </header>

  <main class="page">
    <div class="layout" id="layout">
      <section aria-labelledby="needs-heading">
        <div class="needs-head">
          <h2 id="needs-heading">Most needed right now</h2>
          <button id="share" class="share" type="button" hidden>Share</button>
        </div>
        <ul id="list" class="list" aria-busy="true">
          <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
        </ul>
      </section>

      <aside id="howto" class="howto" aria-labelledby="howto-heading" hidden>
        <h2 id="howto-heading">How to donate</h2>
        <p id="howto-text"></p>
        <dl id="howto-details"></dl>
      </aside>
    </div>

    <footer id="footer">Needs change as stock comes in and goes out.</footer>
  </main>

  <div class="cta" id="cta" hidden><button type="button" id="cta-button">How to donate</button></div>

  <script>
    (function () {
      'use strict';
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var shareUrl = '';

      function $(id) { return document.getElementById(id); }

      function esc(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function fmtDay(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1] : '';
      }

      function render(data) {
        var list = $('list');
        list.setAttribute('aria-busy', 'false');
        data = data || {};
        var info = data.info || {};
        if (info.title) $('title').textContent = info.title;
        if (info.message) $('message').textContent = info.message;

        var items = data.items || [];
        if (!data.configured) {
          list.innerHTML = '<li class="note">The wishlist is being set up. Please check back soon.</li>';
        } else if (!items.length) {
          list.innerHTML = '<li class="note">Nothing urgent right now. Thank you for thinking of us!</li>';
        } else {
          list.innerHTML = items.map(function (it) {
            var pill = it.priority ? '<span class="pill ' + esc(it.priority) + '">' + esc(it.priority) + ' priority</span>' : '<span></span>';
            var updated = it.updated ? '<p class="updated">Updated ' + esc(fmtDay(it.updated)) + '</p>' : '';
            return '<li class="card"><p class="name">' + esc(it.name) + '</p>' + pill +
              '<p class="needed">Needed: <strong>' + esc(it.needed) + '</strong></p>' + updated + '</li>';
          }).join('');
        }

        var details = [['Address', info.address], ['Opening hours', info.hours], ['Contact', info.contact]]
          .filter(function (d) { return d[1]; });
        if (info.howTo || details.length) {
          $('howto-text').textContent = info.howTo || '';
          $('howto-details').innerHTML = details.map(function (d) { return '<dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd>'; }).join('');
          $('howto').hidden = false;
          $('layout').classList.add('has-howto');
          $('cta').hidden = false;
        }

        shareUrl = info.link || '';
        if (shareUrl && (navigator.share || navigator.clipboard)) $('share').hidden = false;
      }

      function fail() {
        $('list').setAttribute('aria-busy', 'false');
        $('list').innerHTML = '<li class="note">The wishlist could not load. Please check your connection and refresh the page.</li>';
      }

      $('cta-button').addEventListener('click', function () {
        $('howto').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      $('share').addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({ title: document.title, text: $('title').textContent, url: shareUrl }).catch(function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl).then(function () { $('share').textContent = 'Link copied'; });
        }
      });

      google.script.run.withSuccessHandler(render).withFailureHandler(fail).getWishlist();
    })();
  </script>
</body>
</html>
